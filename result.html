<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8" />
        <title>Decision Maker</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="title-bar">
            <div class="title">Decision Maker</div>
            <div class="window-buttons">
                <button id="back" onclick="window.location.href='options.html'">
                    <img src="assets/back.png">
                </button>
                <button id="minimize">
                    <img src="assets/minimise.png">
                </button>
                <button id="close">
                    <img src="assets/closebutton.png">
                </button>
            </div>
        </div>
        <div class="result-container">
            <h1 class="result-title">Your decision is...</h1>
            <div class="result-wrapper">
                <img class="star star1" src="assets/star.png">
                <img class="star star2" src="assets/star2.png">
                <img class="star star3" src="assets/star3.png">
                <img class="star star4" src="assets/star.png">
                <img class="star star5" src="assets/star2.png">
                <img class="star star6" src="assets/star3.png">
                <img class="star star7" src="assets/star.png">
                <img class="star star8" src="assets/star2.png">
                <img class="star star9" src="assets/star3.png">
                <img class="star star10" src="assets/star.png">
                <div id="result"></div>
            </div>
        </div>
        <div class = "cat"></div>
        <script src="script.js"></script>
        <script src="renderer.js"></script>
    </body>
</html>
